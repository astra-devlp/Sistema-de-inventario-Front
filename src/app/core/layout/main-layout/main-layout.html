<div class="app-shell" [class.is-collapsed]="collapsed()">
  <aside class="sidebar" [class.is-open]="drawerOpen()">
    <div class="sidebar__brand">
      <span class="sidebar__logo"><app-icon name="box" /></span>
      <span class="sidebar__label">Inventario</span>
    </div>

    <nav class="sidebar__nav">
      @for (group of groups; track group.id) {
        <button
          type="button"
          class="sidebar__group"
          [attr.aria-expanded]="isExpanded(group.id)"
          [title]="group.label"
          (click)="toggleGroup(group.id)"
        >
          <app-icon [name]="group.icon" />
          <span class="sidebar__label">{{ group.label }}</span>
          <app-icon class="sidebar__caret" [class.is-open]="isExpanded(group.id)" name="chevron-down" [size]="16" />
        </button>

        @if (isExpanded(group.id) || collapsed()) {
          <div class="sidebar__submenu">
            @for (item of group.items; track item.path) {
              <a
                class="sidebar__link"
                [routerLink]="item.path"
                routerLinkActive="active"
                [title]="item.label"
                (click)="closeDrawer()"
              >
                <app-icon [name]="item.icon" />
                <span class="sidebar__label">{{ item.label }}</span>
              </a>
            }
          </div>
        }
      }

      <span class="sidebar__section">Próximamente</span>
      @for (item of upcoming; track item.label) {
        <span class="sidebar__link sidebar__link--disabled" [title]="item.label">
          <app-icon [name]="item.icon" />
          <span class="sidebar__label">{{ item.label }}</span>
        </span>
      }
    </nav>
  </aside>
  <div class="sidebar-backdrop" [class.is-open]="drawerOpen()" (click)="closeDrawer()"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="btn btn--icon topbar__menu" aria-label="Abrir menú" (click)="toggleDrawer()">
        <app-icon name="menu" />
      </button>
      <button
        type="button"
        class="btn btn--icon topbar__collapse"
        [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Contraer menú'"
        (click)="toggleCollapsed()"
      >
        <app-icon name="panel-left" />
      </button>
      <span class="topbar__spacer"></span>
      <div class="topbar__user">
        <span class="avatar">{{ initial() }}</span>
        <span>{{ user()?.name }}</span>
        <button type="button" class="btn btn--icon" aria-label="Cerrar sesión" (click)="logout()">
          <app-icon name="logout" />
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
