<section class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand__logo"><app-icon name="box" /></span>
      <div>
        <p class="auth-brand__title">Inventario</p>
        <p class="auth-brand__subtitle">Ingresa para continuar</p>
      </div>
    </div>

    <form class="auth-form" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
      @if (error()) {
        <p class="auth-error">{{ error() }}</p>
      }

      <div class="field">
        <label class="label" for="auth-email">Correo <span class="required">*</span></label>
        <input id="auth-email" class="input" type="email" formControlName="email" autocomplete="username" />
      </div>

      <div class="field">
        <label class="label" for="auth-password">Contraseña <span class="required">*</span></label>
        <input id="auth-password" class="input" type="password" formControlName="password" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        {{ submitting() ? 'Espera…' : 'Entrar' }}
      </button>
    </form>
  </div>
</section>
