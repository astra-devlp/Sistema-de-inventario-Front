<section class="auth-screen">
  <div class="auth-layout">
    <div class="auth-intro">
      <p class="auth-kicker">Astra Dev</p>
      <h1 class="auth-title">Inventario</h1>
      <p class="auth-lede">Entra para ver productos, existencias y movimientos de tu negocio.</p>
    </div>

    <form class="auth-card" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
      <h2 class="auth-card__title">Iniciar sesión</h2>
      <p class="auth-card__hint">Usa el correo y la contraseña de tu cuenta.</p>

      @if (error()) {
        <p class="auth-error">{{ error() }}</p>
      }

      <div class="field">
        <label class="label" for="auth-email">Correo <span class="required">*</span></label>
        <input id="auth-email" class="input" type="email" formControlName="email" autocomplete="username" />
      </div>

      <div class="field">
        <label class="label" for="auth-password">Contraseña <span class="required">*</span></label>
        <input
          id="auth-password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="auth-submit" [disabled]="submitting()">
        {{ submitting() ? 'Espera…' : 'Entrar' }}
      </button>
    </form>
  </div>
</section>
