<app-modal [open]="open()" [title]="customer() ? 'Editar cliente' : 'Nuevo cliente'" (closed)="closed.emit()">
  <form class="form-grid" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error field--full">{{ error() }}</p>
    }
    <div class="field field--full">
      <label class="label" for="cu-name">Nombre o razón social <span class="required">*</span></label>
      <input id="cu-name" class="input" type="text" formControlName="name" />
    </div>
    <div class="field">
      <label class="label" for="cu-type">Tipo de documento <span class="required">*</span></label>
      <select id="cu-type" class="select" formControlName="document_type" (change)="onDocumentType($event)">
        <optgroup label="Más usados">
          @for (type of documentTypeGroups().common; track type.code) {
            <option [value]="type.code">{{ type.code }} — {{ type.label }}</option>
          }
        </optgroup>
        <optgroup label="Otros">
          @for (type of documentTypeGroups().others; track type.code) {
            <option [value]="type.code">{{ type.code }} — {{ type.label }}</option>
          }
        </optgroup>
      </select>
    </div>
    <div class="field">
      <label class="label" for="cu-number">Número de documento <span class="required">*</span></label>
      <input id="cu-number" class="input text-mono" type="text" formControlName="document_number" />
    </div>
    @if (documentType() === nitCode) {
      <div class="field">
        <label class="label" for="cu-digit">Dígito de verificación <span class="required">*</span></label>
        <input id="cu-digit" class="input text-mono" type="text" maxlength="1" formControlName="check_digit" />
        <span class="hint">La DIAN lo exige aparte del NIT.</span>
      </div>
    }
    <div class="field">
      <label class="label" for="cu-email">Correo</label>
      <input id="cu-email" class="input" type="email" formControlName="email" />
    </div>
    <div class="field">
      <label class="label" for="cu-phone">Teléfono</label>
      <input id="cu-phone" class="input" type="tel" formControlName="phone" />
    </div>
    <div class="field field--full">
      <label class="label" for="cu-address">Dirección</label>
      <input id="cu-address" class="input" type="text" formControlName="address" />
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar cliente' }}
    </button>
  </div>
</app-modal>
