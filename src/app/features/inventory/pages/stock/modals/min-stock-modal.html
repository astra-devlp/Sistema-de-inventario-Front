<app-modal [open]="open()" title="Stock mínimo" size="sm" (closed)="closed.emit()">
  <form class="stack" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error">{{ error() }}</p>
    }
    @if (stock(); as current) {
      <p>
        <strong>{{ current.product_name }}</strong> en <strong>{{ current.warehouse_name }}</strong>
        <br />
        <span class="text-muted">Existencia actual: {{ formatQuantity(current.quantity) }}</span>
      </p>
    }
    <div class="field">
      <label class="label" for="ms-minimum">Stock mínimo <span class="required">*</span></label>
      <input id="ms-minimum" class="input" type="number" min="0" step="any" [formControl]="minimum" />
      <span class="hint">La existencia queda en alerta cuando llega a este valor o baja de él. 0 desactiva la alerta.</span>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar' }}
    </button>
  </div>
</app-modal>
