<app-modal [open]="open()" [title]="warehouse() ? 'Editar bodega' : 'Nueva bodega'" (closed)="closed.emit()">
  <form class="form-grid" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error field--full">{{ error() }}</p>
    }
    <div class="field">
      <label class="label" for="wh-code">Código <span class="required">*</span></label>
      <input id="wh-code" class="input text-mono" type="text" maxlength="20" placeholder="PRINCIPAL" formControlName="code" />
    </div>
    <div class="field">
      <label class="label" for="wh-name">Nombre <span class="required">*</span></label>
      <input id="wh-name" class="input" type="text" maxlength="150" formControlName="name" />
    </div>
    <div class="field field--full">
      <label class="label" for="wh-address">Dirección</label>
      <input id="wh-address" class="input" type="text" maxlength="250" formControlName="address" />
    </div>
    <div class="field field--full">
      <label class="check">
        <input type="checkbox" formControlName="is_active" />
        Bodega activa
      </label>
      <span class="hint">Una bodega inactiva no recibe movimientos, pero conserva su historial.</span>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar bodega' }}
    </button>
  </div>
</app-modal>
