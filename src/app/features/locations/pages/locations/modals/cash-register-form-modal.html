<app-modal [open]="open()" [title]="register() ? 'Editar caja' : 'Nueva caja'" (closed)="closed.emit()">
  <form class="form-grid" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error field--full">{{ error() }}</p>
    }
    <div class="field">
      <label class="label" for="cf-code">Código <span class="required">*</span></label>
      <input id="cf-code" class="input" type="text" formControlName="code" [attr.maxlength]="codeMax" />
      <span class="hint">Letras, números y guion; se guarda en mayúsculas. Es el prefijo de los recibos (C1-0001).</span>
    </div>
    <div class="field">
      <label class="label" for="cf-name">Nombre <span class="required">*</span></label>
      <input id="cf-name" class="input" type="text" formControlName="name" />
    </div>
    <div class="field field--full">
      <label class="label" for="cf-location">Sede <span class="required">*</span></label>
      <select id="cf-location" class="select" formControlName="location_id">
        @for (location of options(); track location.id) {
          <option [ngValue]="location.id">{{ location.name }}</option>
        }
      </select>
    </div>
  </form>
  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar' }}
    </button>
  </div>
</app-modal>
