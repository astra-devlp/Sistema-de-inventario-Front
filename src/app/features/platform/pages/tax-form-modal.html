<app-modal [open]="open()" [title]="tax() ? 'Editar IVA' : 'Nueva tarifa de IVA'" size="sm" (closed)="closed.emit()">
  <form class="stack" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error" role="alert">{{ error() }}</p>
    }
    <div class="field">
      <label class="label" for="tx-name">Nombre <span class="required">*</span></label>
      <input id="tx-name" class="input" type="text" maxlength="150" placeholder="Ej: IVA general" formControlName="name" />
    </div>
    <div class="field">
      <label class="label" for="tx-rate">Porcentaje <span class="required">*</span></label>
      <div class="input-group">
        <input id="tx-rate" class="input" type="text" inputmode="decimal" placeholder="19" formControlName="rate" />
        <span class="input-group__addon">%</span>
      </div>
    </div>
    <label class="check"><input type="checkbox" formControlName="is_exempt" /> Exento de IVA</label>
    <p class="hint">Una tarifa que ya usan productos no puede cambiar su porcentaje ni su exención.</p>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar IVA' }}
    </button>
  </div>
</app-modal>
