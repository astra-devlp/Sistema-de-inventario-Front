<section class="card">
  <div class="toolbar">
    <h2 class="acc-panel__title">Unidades de medida (de todas las empresas)</h2>
    <button type="button" class="btn btn--primary" (click)="edit(null)"><app-icon name="plus" /> Nueva unidad</button>
  </div>

  @if (error()) {
    <p class="auth-error" role="alert" style="margin: 16px">{{ error() }}</p>
  }

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Abrev.</th>
          <th>Tipo</th>
          <th class="col-actions">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (unit of units(); track unit.id) {
          <tr>
            <td>{{ unit.name }}</td>
            <td class="text-mono text-muted">{{ unit.abbreviation }}</td>
            <td><span class="badge">{{ unit.unit_type }}</span></td>
            <td class="col-actions">
              <button type="button" class="btn btn--icon" aria-label="Editar" (click)="edit(unit)"><app-icon name="edit" /></button>
              <button type="button" class="btn btn--icon btn--danger-hover" aria-label="Eliminar" (click)="askDelete(unit)"><app-icon name="trash" /></button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4">
              <div class="empty-state">
                <p class="empty-state__title">{{ loading() ? 'Cargando unidades…' : 'No hay unidades' }}</p>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>

<app-unit-form-modal [open]="modal() === 'form'" [unit]="selected()" (closed)="close()" (saved)="saved()" />
<app-confirm-modal
  [open]="modal() === 'delete'"
  title="Confirmar eliminación"
  [message]="'¿Deseas eliminar la unidad ' + (selected()?.name ?? '') + '?'"
  (closed)="close()"
  (confirmed)="remove()"
/>
