<app-modal [open]="open()" [title]="editing() ? 'Editar código' : 'Asignar código'" (closed)="closed.emit()">
  <form class="form-grid" (submit)="$event.preventDefault()">
    <div class="field field--full">
      <label class="label" for="bf-product">Producto <span class="required">*</span></label>
      <select id="bf-product" class="select">
        <option value="">Seleccionar producto</option>
      </select>
    </div>
    <div class="field">
      <label class="label" for="bf-sku">SKU <span class="required">*</span></label>
      <input id="bf-sku" class="input text-mono" type="text" placeholder="Ej: ACE-OLI-500" />
    </div>
    <div class="field">
      <label class="label" for="bf-type">Tipo de código</label>
      <select id="bf-type" class="select">
        <option>EAN-13</option>
        <option>EAN-8</option>
        <option>UPC-A</option>
        <option>Code 128</option>
        <option>QR</option>
      </select>
    </div>
    <div class="field field--full">
      <label class="label" for="bf-code">Código de barras</label>
      <div class="input-group">
        <input id="bf-code" class="input text-mono" type="text" placeholder="7701234567890" />
        <button type="button" class="btn btn--outline">Generar</button>
      </div>
      <span class="hint">Puedes escanear el código o generarlo automáticamente.</span>
    </div>
    <div class="field field--full">
      <label class="label" for="bf-pres">Presentación asociada</label>
      <select id="bf-pres" class="select">
        <option value="">Unidad suelta</option>
      </select>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" (click)="closed.emit()">Guardar</button>
  </div>
</app-modal>
