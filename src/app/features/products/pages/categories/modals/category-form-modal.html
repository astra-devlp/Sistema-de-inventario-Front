<app-modal [open]="open()" [title]="category() ? 'Editar categoría' : 'Nueva categoría'" (closed)="closed.emit()">
  <form class="form-grid" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error field--full" role="alert">{{ error() }}</p>
    }
    <div class="field field--full">
      <label class="label" for="cf-name">Nombre <span class="required">*</span></label>
      <input id="cf-name" class="input" type="text" maxlength="150" placeholder="Ej: Bebidas" formControlName="name" />
    </div>
    <div class="field">
      <label class="label" for="cf-code">Código</label>
      <input id="cf-code" class="input text-mono" type="text" maxlength="50" placeholder="Ej: BEB" formControlName="code" />
    </div>
    <div class="field">
      <label class="label" for="cf-parent">Categoría padre</label>
      <select id="cf-parent" class="select" formControlName="parent_id">
        <option value="">Ninguna (principal)</option>
        @for (option of parentOptions(); track option.id) {
          <option [value]="option.id">{{ option.name }}</option>
        }
      </select>
    </div>
    <div class="field field--full">
      <label class="label" for="cf-desc">Descripción</label>
      <textarea id="cf-desc" class="textarea" placeholder="Descripción opcional" formControlName="description"></textarea>
    </div>
    <label class="check field--full"><input type="checkbox" formControlName="is_active" /> Categoría activa</label>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar categoría' }}
    </button>
  </div>
</app-modal>
