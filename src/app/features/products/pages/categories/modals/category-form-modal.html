<app-modal [open]="open()" [title]="editing() ? 'Editar categoría' : 'Nueva categoría'" (closed)="closed.emit()">
  <form class="form-grid" (submit)="$event.preventDefault()">
    <div class="field field--full">
      <label class="label" for="cf-name">Nombre <span class="required">*</span></label>
      <input id="cf-name" class="input" type="text" placeholder="Ej: Bebidas" />
    </div>
    <div class="field">
      <label class="label" for="cf-code">Código</label>
      <input id="cf-code" class="input text-mono" type="text" placeholder="Ej: BEB" />
    </div>
    <div class="field">
      <label class="label" for="cf-parent">Categoría padre</label>
      <select id="cf-parent" class="select">
        <option value="">Ninguna (principal)</option>
      </select>
    </div>
    <div class="field field--full">
      <label class="label" for="cf-desc">Descripción</label>
      <textarea id="cf-desc" class="textarea" placeholder="Descripción opcional"></textarea>
    </div>
    <label class="check field--full"><input type="checkbox" checked /> Categoría activa</label>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" (click)="closed.emit()">Guardar categoría</button>
  </div>
</app-modal>
