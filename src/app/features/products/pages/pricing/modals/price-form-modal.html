<app-modal [open]="open()" [title]="price() ? 'Editar precio' : 'Nuevo precio'" (closed)="closed.emit()">
  <form class="form-grid" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error field--full">{{ error() }}</p>
    }
    <div class="field field--full">
      <label class="label" for="pc-product">Producto <span class="required">*</span></label>
      <select id="pc-product" class="select" formControlName="product_id">
        <option value="">Seleccionar producto</option>
        @for (product of products(); track product.id) {
          <option [value]="product.id">{{ product.name }} ({{ product.sku }})</option>
        }
      </select>
    </div>
    <div class="field">
      <label class="label" for="pc-list">Lista de precios</label>
      <select id="pc-list" class="select" formControlName="price_list">
        @for (list of priceLists; track list) {
          <option [value]="list">{{ list }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label class="label" for="pc-pres">Presentación</label>
      <select id="pc-pres" class="select" formControlName="presentation_id">
        <option value="">Unidad suelta</option>
        @for (presentation of presentations(); track presentation.id) {
          <option [value]="presentation.id">{{ presentation.name }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label class="label" for="pc-cost">Costo</label>
      <div class="input-group">
        <span class="input-group__addon">$</span>
        <input id="pc-cost" class="input" type="number" min="0" step="0.01" formControlName="cost" placeholder="0.00" />
      </div>
    </div>
    <div class="field">
      <label class="label" for="pc-margin">Margen</label>
      <div class="input-group">
        <input id="pc-margin" class="input" type="number" min="0" step="0.01" formControlName="margin" placeholder="0" />
        <span class="input-group__addon">%</span>
      </div>
    </div>
    <div class="field">
      <label class="label" for="pc-price">Precio sin IVA <span class="required">*</span></label>
      <div class="input-group">
        <span class="input-group__addon">$</span>
        <input id="pc-price" class="input" type="number" min="0" step="0.01" formControlName="price_without_tax" placeholder="0.00" />
      </div>
    </div>
    <div class="field">
      <label class="label" for="pc-final">Precio con IVA</label>
      <input id="pc-final" class="input" type="text" [value]="priceWithTax()" placeholder="Calculado automáticamente" disabled />
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar precio' }}
    </button>
  </div>
</app-modal>
