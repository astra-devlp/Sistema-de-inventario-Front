<app-modal [open]="open()" [title]="product() ? 'Editar producto' : 'Nuevo producto'" size="lg" (closed)="closed.emit()">
  <form class="form-grid" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error field--full">{{ error() }}</p>
    }
    <h3 class="form-section-title">Información general</h3>
    <div class="field field--full">
      <label class="label" for="pf-name">Nombre <span class="required">*</span></label>
      <input id="pf-name" class="input" type="text" formControlName="name" placeholder="Ej: Aceite de oliva 500 ml" />
    </div>
    <div class="field">
      <label class="label" for="pf-category">Categoría <span class="required">*</span></label>
      <select id="pf-category" class="select" formControlName="category_id">
        <option value="">Seleccionar categoría</option>
        @for (category of catalogs().categories; track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label class="label" for="pf-brand">Marca</label>
      <input id="pf-brand" class="input" type="text" formControlName="brand" placeholder="Ej: Marca X" />
    </div>
    <div class="field field--full">
      <label class="label" for="pf-desc">Descripción</label>
      <textarea id="pf-desc" class="textarea" formControlName="description" placeholder="Descripción opcional del producto"></textarea>
    </div>

    <h3 class="form-section-title">Identificación</h3>
    <div class="field">
      <label class="label" for="pf-sku">SKU <span class="required">*</span></label>
      <input id="pf-sku" class="input text-mono" type="text" formControlName="sku" placeholder="Ej: ACE-OLI-500" />
    </div>
    <div class="field">
      <label class="label" for="pf-barcode">Código de barras</label>
      <input id="pf-barcode" class="input text-mono" type="text" formControlName="barcode" placeholder="EAN-13 / UPC" />
    </div>

    <h3 class="form-section-title">Unidad y presentación</h3>
    <div class="field">
      <label class="label" for="pf-unit">Unidad de medida <span class="required">*</span></label>
      <select id="pf-unit" class="select" formControlName="unit_id">
        <option value="">Seleccionar unidad</option>
        @for (unit of catalogs().units; track unit.id) {
          <option [value]="unit.id">{{ unit.name }} ({{ unit.abbreviation }})</option>
        }
      </select>
    </div>
    <div class="field">
      <label class="label" for="pf-pres">Presentación</label>
      <select id="pf-pres" class="select" formControlName="presentation_id">
        <option value="">Unidad suelta</option>
        @for (presentation of catalogs().presentations; track presentation.id) {
          <option [value]="presentation.id">{{ presentation.name }}</option>
        }
      </select>
      <span class="hint">Ej: Caja x100</span>
    </div>

    <h3 class="form-section-title">Precios e impuestos</h3>
    <div class="field">
      <label class="label" for="pf-cost">Costo</label>
      <div class="input-group">
        <span class="input-group__addon">$</span>
        <input id="pf-cost" class="input" type="number" min="0" step="0.01" formControlName="cost" placeholder="0.00" />
      </div>
    </div>
    <div class="field">
      <label class="label" for="pf-price">Precio de venta <span class="required">*</span></label>
      <div class="input-group">
        <span class="input-group__addon">$</span>
        <input id="pf-price" class="input" type="number" min="0" step="0.01" formControlName="sale_price" placeholder="0.00" />
      </div>
    </div>
    <div class="field">
      <label class="label" for="pf-tax">IVA</label>
      <select id="pf-tax" class="select" formControlName="tax_id">
        <option value="">{{ product() ? 'Sin IVA' : 'IVA por defecto' }}</option>
        @for (tax of catalogs().taxes; track tax.id) {
          <option [value]="tax.id">{{ tax.name }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label class="label" for="pf-final">Precio con IVA</label>
      <input id="pf-final" class="input" type="text" [value]="priceWithTax()" placeholder="Calculado automáticamente" disabled />
    </div>

    <h3 class="form-section-title">Inventario</h3>
    <div class="field">
      <label class="label" for="pf-min">Stock mínimo</label>
      <input id="pf-min" class="input" type="number" min="0" step="1" formControlName="min_stock" placeholder="0" />
    </div>
    <div class="field">
      <label class="label" for="pf-status">Estado</label>
      <select id="pf-status" class="select" formControlName="is_active">
        <option value="true">Activo</option>
        <option value="false">Inactivo</option>
      </select>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar producto' }}
    </button>
  </div>
</app-modal>
