<app-modal [open]="open()" [title]="editing() ? 'Editar presentación' : 'Nueva presentación'" (closed)="closed.emit()">
  <form class="form-grid" (submit)="$event.preventDefault()">
    <div class="field field--full">
      <label class="label" for="pr-name">Nombre <span class="required">*</span></label>
      <input id="pr-name" class="input" type="text" placeholder="Ej: Caja x100" />
    </div>
    <div class="field">
      <label class="label" for="pr-type">Empaque</label>
      <select id="pr-type" class="select">
        <option>Caja</option>
        <option>Paquete</option>
        <option>Bulto</option>
        <option>Docena</option>
        <option>Pallet</option>
      </select>
    </div>
    <div class="field">
      <label class="label" for="pr-qty">Cantidad por presentación <span class="required">*</span></label>
      <input id="pr-qty" class="input" type="number" min="1" placeholder="100" />
    </div>
    <div class="field field--full">
      <label class="label" for="pr-unit">Unidad base <span class="required">*</span></label>
      <select id="pr-unit" class="select">
        <option value="">Seleccionar unidad</option>
      </select>
      <span class="hint">Una Caja x100 equivale a 100 unidades base.</span>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" (click)="closed.emit()">Guardar presentación</button>
  </div>
</app-modal>
