<app-modal [open]="open()" [title]="presentation() ? 'Editar presentación' : 'Nueva presentación'" (closed)="closed.emit()">
  <form class="form-grid" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error field--full" role="alert">{{ error() }}</p>
    }
    <div class="field field--full">
      <label class="label" for="pr-name">Nombre <span class="required">*</span></label>
      <input id="pr-name" class="input" type="text" maxlength="150" placeholder="Ej: Caja x100" formControlName="name" />
    </div>
    <div class="field">
      <label class="label" for="pr-type">Empaque</label>
      <select id="pr-type" class="select" formControlName="packaging">
        @for (packaging of packagings; track packaging) {
          <option [value]="packaging">{{ packaging }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label class="label" for="pr-qty">Cantidad por presentación <span class="required">*</span></label>
      <input id="pr-qty" class="input" type="number" min="1" step="1" placeholder="100" formControlName="quantity" />
    </div>
    <div class="field field--full">
      <label class="label" for="pr-unit">Unidad base <span class="required">*</span></label>
      <select id="pr-unit" class="select" formControlName="unit_id">
        <option value="">Seleccionar unidad</option>
        @for (unit of units(); track unit.id) {
          <option [value]="unit.id">{{ unit.name }} ({{ unit.abbreviation }})</option>
        }
      </select>
      <span class="hint">Una Caja x100 equivale a 100 unidades base.</span>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar presentación' }}
    </button>
  </div>
</app-modal>
