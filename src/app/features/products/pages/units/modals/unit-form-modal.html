<app-modal [open]="open()" [title]="unit() ? 'Editar unidad' : 'Nueva unidad de medida'" size="sm" (closed)="closed.emit()">
  <form class="stack" [formGroup]="form" (submit)="$event.preventDefault(); submit()">
    @if (error()) {
      <p class="auth-error">{{ error() }}</p>
    }
    <div class="field">
      <label class="label" for="uf-name">Nombre <span class="required">*</span></label>
      <input id="uf-name" class="input" type="text" formControlName="name" placeholder="Ej: Kilogramo" />
    </div>
    <div class="field">
      <label class="label" for="uf-abbr">Abreviatura <span class="required">*</span></label>
      <input id="uf-abbr" class="input" type="text" formControlName="abbreviation" placeholder="Ej: kg" />
    </div>
    <div class="field">
      <label class="label" for="uf-type">Tipo</label>
      <select id="uf-type" class="select" formControlName="unit_type">
        @for (type of unitTypes; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn--outline" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn--primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Guardando…' : 'Guardar unidad' }}
    </button>
  </div>
</app-modal>
