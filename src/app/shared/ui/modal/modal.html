@if (open()) {
  <div class="modal-backdrop" (mousedown)="onBackdrop($event)">
    <div class="modal" [class.modal--sm]="size() === 'sm'" [class.modal--lg]="size() === 'lg'" role="dialog" aria-modal="true">
      <header class="modal__header">
        <h2 class="modal__title">{{ title() }}</h2>
        <button type="button" class="btn btn--icon" aria-label="Cerrar" (click)="closed.emit()">
          <app-icon name="x" />
        </button>
      </header>
      <div class="modal__body">
        <ng-content />
      </div>
      <footer class="modal__footer">
        <ng-content select="[modal-footer]" />
      </footer>
    </div>
  </div>
}
