<!doctype html>
<html lang="es" class="dark">
  <head>
    <script>
      (function () {
        try {
          var key = localStorage.getItem('astra-theme') || localStorage.getItem('astra-inventario-theme');
          var theme = key === 'light' || key === 'dark' ? key : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <title>Sistema de Inventario</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="brand/favicon.png" />
    <link rel="apple-touch-icon" href="brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
